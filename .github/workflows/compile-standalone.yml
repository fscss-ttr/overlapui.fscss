name: Compile overlapui.css

on:
  push:
    branches: [main, master]
    paths:
      - "overlapui.fscss"
      - "overlapui.standalone.fscss"
      - ".github/workflows/compile-standalone.yml"
  pull_request:
    paths:
      - "overlapui.fscss"
      - "overlapui.standalone.fscss"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FSCSS CLI
        run: npm install -g fscss@1.2.5

      - name: Compile standalone → overlapui.css
        run: |
          fscss overlapui.standalone.fscss overlapui.css
          # optional minified sibling if CLI supports it; otherwise skip
          # if command -v fscss >/dev/null 2>&1; then
          #  fscss overlapui.standalone.fscss overlapui.min.css 2>/dev/null || true
          fi
          ls -la overlapui.css
          head -n 5 overlapui.css

      - name: Commit compiled CSS (main only)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overlapui.css
          # git add overlapui.min.css 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No CSS changes"
          else
            git commit -m "chore: recompile overlapui.css from standalone entry"
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: overlapui-css
          path: |
            overlapui.css
